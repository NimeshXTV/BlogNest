<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Article</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h1>New Article</h1>

    <form th:action="@{/admin/new}" th:object="${article}" method="post">

        <div>
            <label for="title">Title</label>

            <input type="text"
                   id="title"
                   th:field="*{title}">

            <p class="error-message"
               th:errors="*{title}">
            </p>
        </div>

        <div>
            <label for="content">Content</label>

            <textarea id="content"
                      th:field="*{content}"
                      rows="15"></textarea>

            <p class="error-message"
               th:errors="*{content}">
            </p>
        </div>

        <button type="submit">Create Article</button>

    </form>

    <a href="/admin">← Back to Dashboard</a>

</div>

</body>
</html>
