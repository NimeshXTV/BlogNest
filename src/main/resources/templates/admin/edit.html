<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Edit Article</title>

    <link rel="icon"
          type="image/png"
          th:href="@{/images/logo.png}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <!-- Quill editor -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
          rel="stylesheet">
</head>

<body>

<div class="container admin-form-page">

    <h1>Edit Article</h1>

    <form class="article-form"
          th:action="@{/admin/edit/{id}(id=${id})}"
          th:object="${article}"
          method="post">

        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">

        <div class="form-group">

            <label for="title">
                Title
            </label>

            <input type="text"
                   id="title"
                   th:field="*{title}"
                   placeholder="Give your article a title">

            <p class="error-message"
               th:errors="*{title}">
            </p>

        </div>

        <div class="form-group">

            <label>
                Content
            </label>

            <div id="editor"></div>

            <textarea id="content"
                      name="content"
                      th:field="*{content}"
                      hidden></textarea>

            <p class="error-message"
               th:errors="*{content}">
            </p>

        </div>

        <button type="submit"
                class="form-submit">
            Save Changes
        </button>

    </form>

    <a href="/admin"
       class="back-link">
        ← Back to Dashboard
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

<script>

    const content =
        document.getElementById("content");

    const quill = new Quill("#editor", {

        theme: "snow",

        placeholder: "Write your article...",

        modules: {

            toolbar: [
                ["bold", "italic", "underline"],
                [{ "header": [1, 2, 3, false] }],
                [{ "list": "bullet" }],
                ["blockquote", "code-block"],
                ["link"],
                ["clean"]
            ]
        }
    });

    /*
     * Load existing article HTML.
     */
    quill.root.innerHTML =
        content.value;

    const form =
        document.querySelector(".article-form");

    form.addEventListener("submit", function () {

        if (quill.getText().trim() === "") {

            content.value = "";

        } else {

            content.value =
                quill.root.innerHTML;
        }

    });

</script>

</body>
</html>
