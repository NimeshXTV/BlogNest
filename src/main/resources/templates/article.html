<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${article.title}">
        Article
    </title>

    <link rel="icon"
          type="image/png"
          th:href="@{/images/logo.png}">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container article-page">

    <h1 th:text="${article.title}">
        Article title
    </h1>

    <p class="article-date"
       th:text="${article.publicationDate}">
        Publication date
    </p>

    <div class="article-content"
         th:utext="${article.content}">
        Article content
    </div>

    <a th:if="${fromAdmin}"
       href="/admin"
       class="back-link">
        ← Back to Admin
    </a>

    <a th:unless="${fromAdmin}"
       href="/"
       class="back-link">
        ← Back to Home
    </a>

</div>

</body>
</html>
